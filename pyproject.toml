[project]
name = "orbit-cv"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "dmukhopadhyay1987", email = "dmukhopadhyay1987@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.11",
    "fastmcp>=3.4.7",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "openai>=3.6.0",
    "pydantic>=2.13.5",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.0",
]

[project.scripts]
orbit-cv = "orbit_cv:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
